name: Spelling and link checks

on:
  push:
    branches: [ main ]   # change if your default branch is different
  pull_request:
  schedule:
    - cron: "7 10 * * 1"  # 02:07 UTC on Monday (note: UK local time shifts with DST)

permissions:
  contents: read

env:
  SITE_URL: https://homesheatandhealthykids.github.io/  # Our published site
jobs:
  spellcheck:
    name: Spell check (UK English)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: CSpell
        uses: streetsidesoftware/cspell-action@v8
        with:
          config: ./spellcheck-config.json
          # Limit to common web repo file types
          files: |
            **/*.md
            **/*.html
            **/*.yml
            **/*.yaml
            **/*.json
            **/*.css
            **/*.scss
            **/*.js
          incremental_files_only: ${{ github.event_name == 'pull_request' }}

  linkcheck_repo:
    name: Link check (repository files)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Lychee (scan repo)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config ./linkcheck-config.toml .
      - name: Fail if links are broken
        run: exit ${{ steps.lychee.outputs.exit_code }}

  linkcheck_site:
    name: Link check (live site, weekly 02:07 UTC on Monday)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: check_path (search for config)
        run: pwd ls -la find . -maxdepth 3 -name 'linkcheck-config.toml'
      - name: Lychee (scan live site)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config ./linkcheck-config.toml ${{ env.SITE_URL }}
      - name: Fail if links are broken
        run: exit ${{ steps.lychee.outputs.exit_code }}
