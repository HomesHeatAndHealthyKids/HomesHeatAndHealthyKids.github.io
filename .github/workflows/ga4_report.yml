name: GA4 weekly report

on:
  workflow_dispatch: # manual trigger from GitHub UI
#  schedule:
#    - cron: "17 8 * * 1" # Mondays at 08:17 UTC

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write GA service account key
        run: |
          echo '${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}' > "$GITHUB_WORKSPACE/ga-key.json"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data==0.18.* # or latest

      - name: Generate GA4 Slack blocks (Python)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/ga-key.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          WEBSITE_BASE_URL: ${{ secrets.WEBSITE_BASE_URL }}
        run: python scripts/ga_report_blocks.py

      - name: Build Slack payload
        id: payload
        run: |
          BLOCKS=$(jq -c . < slack_blocks.json)
          echo "blocks=$BLOCKS" >> "$GITHUB_OUTPUT"

      - name: Post to Slack (#website)
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "Weekly GA4 report",
              "blocks": ${{ steps.payload.outputs.blocks }}
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ga4-slack-report
          path: slack_blocks.json
